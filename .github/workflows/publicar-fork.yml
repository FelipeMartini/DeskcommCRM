name: Publicar Imagens do Fork (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Compilar e Publicar no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marca curta do commit
        id: marca
        run: echo "curta=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Converter nome do repositorio para minusculo
        id: repo
        run: echo "nome=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # `:latest` é "o topo da main" e SÓ da main. Um `workflow_dispatch` de outro ramo (por exemplo
      # a imagem de produção mais um cherry-pick, para uma janela que não leva migrations) publica
      # apenas a etiqueta `sha-…`, imutável, e não move o `:latest` de ninguém.
      - name: Etiquetas das imagens (a latest é só da main)
        id: etiquetas
        env:
          REF: ${{ github.ref }}
          NOME: ${{ steps.repo.outputs.nome }}
          CURTA: ${{ steps.marca.outputs.curta }}
        run: |
          {
            echo "app<<FIM"
            echo "ghcr.io/${NOME}:sha-${CURTA}"
            if [ "${REF}" = "refs/heads/main" ]; then echo "ghcr.io/${NOME}:latest"; fi
            echo "FIM"
            echo "worker<<FIM"
            echo "ghcr.io/${NOME}-worker:sha-${CURTA}"
            if [ "${REF}" = "refs/heads/main" ]; then echo "ghcr.io/${NOME}-worker:latest"; fi
            echo "FIM"
          } >> "$GITHUB_OUTPUT"

      - name: Construir e Publicar App Web Next.js
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.etiquetas.outputs.app }}
          cache-from: type=gha,scope=deskcomm-app
          cache-to: type=gha,mode=max,scope=deskcomm-app

      - name: Construir e Publicar Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.etiquetas.outputs.worker }}
          cache-from: type=gha,scope=deskcomm-worker
          cache-to: type=gha,mode=max,scope=deskcomm-worker
