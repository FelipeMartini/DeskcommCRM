name: Publicar Imagens do Fork (GHCR)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: Compilar e Publicar no GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marca curta do commit
        id: marca
        run: echo "curta=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Converter nome do repositorio para minusculo
        id: repo
        run: echo "nome=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Construir e Publicar App Web Next.js
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.nome }}:latest
            ghcr.io/${{ steps.repo.outputs.nome }}:sha-${{ steps.marca.outputs.curta }}
          cache-from: type=gha,scope=deskcomm-app
          cache-to: type=gha,mode=max,scope=deskcomm-app

      - name: Construir e Publicar Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.nome }}-worker:latest
            ghcr.io/${{ steps.repo.outputs.nome }}-worker:sha-${{ steps.marca.outputs.curta }}
          cache-from: type=gha,scope=deskcomm-worker
          cache-to: type=gha,mode=max,scope=deskcomm-worker
