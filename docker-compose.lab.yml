# Stack Docker para o DeskcommCRM no ambiente de homologação e produção do laboratório (10.1.1.4).
# Mapeado para o subdomínio https://deskcommcrm.poa.metodoatuarial.com.br atrás do HAProxy.
#
# Uso no host 10.1.1.4:
#   docker compose -f docker-compose.lab.yml --env-file .env.lab up -d

version: "3.9"

services:
  app:
    container_name: expanda-crm
    image: ${APP_IMAGE:-ghcr.io/felipemartini/deskcommcrm:latest}
    restart: unless-stopped
    ports:
      - "3033:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://deskcommcrm.poa.metodoatuarial.com.br}
      WAHA_API_BASE_URL: http://waha:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
      - waha
    mem_limit: 768m
    networks:
      - crm-net

  waha:
    container_name: expanda-crm-waha
    image: devlikeapro/waha:noweb
    restart: unless-stopped
    ports:
      - "3034:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      - crm-waha-sessions:/app/.sessions
      - crm-waha-media:/app/.media
    mem_limit: 512m
    networks:
      - crm-net

  worker:
    container_name: expanda-crm-worker
    image: ${WORKER_IMAGE:-ghcr.io/felipemartini/deskcommcrm-worker:latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      WAHA_API_BASE_URL: http://waha:3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
      - app
      - waha
    mem_limit: 512m
    networks:
      - crm-net

  redis:
    container_name: expanda-crm-redis
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - crm-net

volumes:
  crm-waha-sessions:
  crm-waha-media:

networks:
  crm-net:
    driver: bridge
